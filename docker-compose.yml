services:
  mysql:
    image: mysql:8.4
    container_name: gtin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gtin
      MYSQL_USER: gtin
      MYSQL_PASSWORD: gtin
    # Host 3307 avoids clash with local MySQL on 3306. Container still listens on 3306.
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugtin", "-pgtin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtin-api
    restart: unless-stopped
    ports:
      - "${API_PUBLISH_PORT:-8000}:${API_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: gtin
      MYSQL_PASSWORD: gtin
      MYSQL_DATABASE: gtin
      API_KEY: ${API_KEY:-dev-local-key}
      APIFY_ENABLED: ${APIFY_ENABLED:-true}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_GOOGLE_ACTOR: ${APIFY_GOOGLE_ACTOR:-apify/google-search-scraper}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      NAME_TTL_DAYS: ${NAME_TTL_DAYS:-30}
      PRICE_TTL_HOURS: ${PRICE_TTL_HOURS:-12}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"API_PORT\",\"8000\")}/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  mysql_data:
