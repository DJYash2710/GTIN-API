services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gtin
      MYSQL_USER: gtin
      MYSQL_PASSWORD: gtin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugtin", "-pgtin"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APIFY_ENABLED: "false"
      API_KEY: dev-local-key
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: gtin
      MYSQL_PASSWORD: gtin
      MYSQL_DATABASE: gtin
      NAME_TTL_DAYS: "30"
      PRICE_TTL_HOURS: "12"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
